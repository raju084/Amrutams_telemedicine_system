apiVersion: v1
kind: ConfigMap
metadata:
  name: amrutam-config
  namespace: production
data:
  DEBUG: "False"
  ALLOWED_HOSTS: "api.amrutam.com,amrutam.com"
  DB_ENGINE: "django.db.backends.postgresql"
  DB_NAME: "amrutam_production_db"
  DB_HOST: "aurora-postgres-cluster.production.rds.amazonaws.com"
  DB_PORT: "5432"
  DB_CONN_MAX_AGE: "600"
  REDIS_URL: "redis://amrutam-redis-cluster.cache.amazonaws.com:6379/0"
  CELERY_BROKER_URL: "redis://amrutam-redis-cluster.cache.amazonaws.com:6379/1"
  CELERY_RESULT_BACKEND: "redis://amrutam-redis-cluster.cache.amazonaws.com:6379/2"
  PROMETHEUS_METRICS_ENABLED: "True"
  LOG_LEVEL: "INFO"
---
apiVersion: v1
kind: Secret
metadata:
  name: amrutam-secrets
  namespace: production
type: Opaque
stringData:
  SECRET_KEY: "change-to-production-grade-256bit-secret-in-vault-or-aws-secrets-manager"
  DB_USER: "amrutam_master_admin"
  DB_PASSWORD: "SuperSecureClusterPassword2026!"
  DATA_ENCRYPTION_KEY: "s8zP9kL0jXy3mQ1vT4wZ6aB8cE0gI2kM4oP6rS8uW0Y="
