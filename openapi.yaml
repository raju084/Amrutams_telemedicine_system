openapi: 3.0.3
info:
  title: Amrutam Telemedicine API
  version: 1.0.0
  description: Production-grade RESTful API for Amrutam Telemedicine & Ayurvedic Healthcare
    System. Supports end-to-end user lifecycle, high-concurrency doctor scheduling,
    race-condition protected bookings, tamper-evident audit trails, digital prescriptions,
    and admin analytics.
paths:
  /api/v1/analytics/overview/:
    get:
      operationId: analytics_overview_retrieve
      description: |-
        High-performance analytics endpoint for Amrutam hospital administrators.
        Provides volume tracking (supporting 100k daily consultations target),
        doctor utilization, and Ayurvedic specialization revenue metrics.
      tags:
      - Admin Analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAnalyticsResponse'
          description: ''
  /api/v1/audit/:
    get:
      operationId: audit_list
      description: |-
        List compliance audit trail with filtering by action, user, or date.
        Restricted to Compliance Auditors and Admins.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Compliance & Audit Trails
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/v1/audit/verify-chain/:
    get:
      operationId: audit_verify_chain_retrieve
      description: |-
        Cryptographic verification of audit log chain integrity.
        Validates that no records have been altered, injected, or removed.
      tags:
      - Compliance & Audit Trails
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditChainVerifyResponse'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Authenticates user with email and password.
        Returns JWT tokens or temporary token if MFA challenge is required.
      tags:
      - Authentication & Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
  /api/v1/auth/mfa/setup/:
    post:
      operationId: auth_mfa_setup_create
      description: Generates TOTP secret and QR provisioning URI for Google Authenticator.
      tags:
      - Authentication & Users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MFASetupResponse'
          description: ''
  /api/v1/auth/mfa/verify/:
    post:
      operationId: auth_mfa_verify_create
      description: Verifies 6-digit TOTP token to complete MFA activation or MFA login.
      tags:
      - Authentication & Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MFAVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MFAVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MFAVerifyRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MFAVerifyResponse'
          description: ''
  /api/v1/auth/profile/:
    get:
      operationId: auth_profile_retrieve
      description: Retrieve and update authenticated user details and profile.
      tags:
      - Authentication & Users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
          description: ''
    patch:
      operationId: auth_profile_partial_update
      description: Retrieve and update authenticated user details and profile.
      tags:
      - Authentication & Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserDetailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserDetailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserDetailRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: Register a new user (Patient, Doctor, Admin).
      tags:
      - Authentication & Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/consultations/:
    get:
      operationId: consultations_list
      description: List consultations for the authenticated user (Patient sees theirs,
        Doctor sees theirs, Admin sees all).
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Consultations Lifecycle
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedConsultationDetailList'
          description: ''
  /api/v1/consultations/{id}/:
    get:
      operationId: consultations_retrieve
      description: Retrieve single consultation details.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Consultations Lifecycle
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultationDetail'
          description: ''
  /api/v1/consultations/{id}/transition/:
    post:
      operationId: consultations_transition_create
      description: |-
        State machine transition handler:
        - START: Doctor begins the live video call (transitions to IN_PROGRESS)
        - COMPLETE: Doctor ends the consultation (transitions to COMPLETED)
        - CANCEL: Patient or Doctor cancels (frees the slot)
        - NO_SHOW: Doctor marks patient absent
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Consultations Lifecycle
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsultationStatusTransitionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConsultationStatusTransitionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConsultationStatusTransitionRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultationTransitionResponse'
          description: ''
  /api/v1/consultations/{id}/video-token/:
    get:
      operationId: consultations_video_token_retrieve
      description: Returns WebRTC / Agora video credentials for the consultation room.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Consultations Lifecycle
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoTokenResponse'
          description: ''
  /api/v1/consultations/book/:
    post:
      operationId: consultations_book_create
      description: |-
        Reserve an availability slot and initiate a consultation booking.
        Protected with Idempotency-Key support and concurrency locking.
      tags:
      - Consultations Lifecycle
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsultationCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConsultationCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConsultationCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultationBookResponse'
          description: ''
  /api/v1/doctors/:
    get:
      operationId: doctors_list
      description: Search and filter verified doctors by specialization, fee, experience,
        rating, or date availability.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Doctors & Availability
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDoctorListList'
          description: ''
  /api/v1/doctors/{doctor_id}/slots/:
    get:
      operationId: doctors_slots_list
      description: List available slots for a doctor on a specific date.
      parameters:
      - in: path
        name: doctor_id
        schema:
          type: string
          format: uuid
        required: true
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Doctors & Availability
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAvailabilitySlotList'
          description: ''
  /api/v1/doctors/{id}/:
    get:
      operationId: doctors_retrieve
      description: Retrieve public details of a specific doctor.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Doctors & Availability
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorDetail'
          description: ''
  /api/v1/doctors/slots/batch-create/:
    post:
      operationId: doctors_slots_batch_create_create
      description: Allows an authenticated doctor to generate availability slots in
        bulk.
      tags:
      - Doctors & Availability
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlotBatchCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SlotBatchCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SlotBatchCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchCreateSlotResponse'
          description: ''
  /api/v1/health/live/:
    get:
      operationId: health_live_retrieve
      description: 'Kubernetes Liveness Probe: Returns HTTP 200 if process is running.'
      tags:
      - Health & Observability
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'
          description: ''
  /api/v1/health/ready/:
    get:
      operationId: health_ready_retrieve
      description: 'Kubernetes Readiness Probe: Verifies live connectivity to PostgreSQL
        and Redis.'
      tags:
      - Health & Observability
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
          description: ''
  /api/v1/payments/{id}/:
    get:
      operationId: payments_retrieve
      description: Retrieve payment status by consultation or payment ID.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Payments & Billing
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentStatusResponse'
          description: ''
  /api/v1/payments/initiate/:
    post:
      operationId: payments_initiate_create
      description: |-
        Initiate checkout payment for a reserved consultation.
        Requires or generates an Idempotency-Key.
      tags:
      - Payments & Billing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentInitiateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PaymentInitiateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentInitiateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentInitiateResponse'
          description: ''
  /api/v1/payments/webhook/:
    post:
      operationId: payments_webhook_create
      description: |-
        Asynchronous payment webhook from Payment Gateway (e.g., Razorpay/Stripe).
        Processed with strict idempotency and signature verification.
      tags:
      - Payments & Billing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentWebhookRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PaymentWebhookRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentWebhookRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
          description: ''
  /api/v1/prescriptions/:
    post:
      operationId: prescriptions_create
      description: Allows the consulting doctor to create and cryptographically sign
        a digital prescription.
      tags:
      - Prescriptions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrescriptionCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PrescriptionCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PrescriptionCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrescriptionCreatedResponse'
          description: ''
  /api/v1/prescriptions/{id}/:
    get:
      operationId: prescriptions_retrieve
      description: Retrieve prescription by ID.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Prescriptions
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrescriptionDetail'
          description: ''
  /api/v1/prescriptions/{id}/verify-signature/:
    get:
      operationId: prescriptions_verify_signature_retrieve
      description: |-
        Public / Pharmacy verification endpoint:
        Verifies that the prescription was indeed signed by the licensed doctor and has not been altered.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Prescriptions
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrescriptionSignatureVerification'
          description: ''
components:
  schemas:
    ActionEnum:
      enum:
      - START
      - COMPLETE
      - CANCEL
      - NO_SHOW
      type: string
      description: |-
        * `START` - START
        * `COMPLETE` - COMPLETE
        * `CANCEL` - CANCEL
        * `NO_SHOW` - NO_SHOW
    AdminAnalyticsResponse:
      type: object
      properties:
        success:
          type: boolean
        timestamp:
          type: string
          format: date-time
        consultations:
          type: object
          additionalProperties: {}
        revenue:
          type: object
          additionalProperties: {}
        doctor_utilization:
          type: object
          additionalProperties: {}
        sla_observability:
          type: object
          additionalProperties: {}
      required:
      - consultations
      - doctor_utilization
      - revenue
      - sla_observability
      - success
      - timestamp
    AuditChainVerifyResponse:
      type: object
      properties:
        success:
          type: boolean
        chain_integrity:
          type: string
        verified_records_count:
          type: integer
        tampered_records:
          type: array
          items:
            type: object
            additionalProperties: {}
        compliance_standard:
          type: string
      required:
      - chain_integrity
      - compliance_standard
      - success
      - tampered_records
      - verified_records_count
    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
        user_id:
          type: string
          format: uuid
          nullable: true
        user_email:
          type: string
          maxLength: 255
        user_role:
          type: string
          maxLength: 50
        action:
          type: string
          maxLength: 100
        resource_type:
          type: string
          maxLength: 100
        resource_id:
          type: string
          maxLength: 100
        ip_address:
          type: string
          nullable: true
        user_agent:
          type: string
          maxLength: 500
        correlation_id:
          type: string
          maxLength: 100
        payload_diff: {}
        previous_log_hash:
          type: string
          maxLength: 64
        log_hash:
          type: string
          readOnly: true
      required:
      - action
      - id
      - log_hash
      - resource_id
      - resource_type
      - timestamp
    AvailabilitySlot:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        doctor_id:
          type: string
          format: uuid
          readOnly: true
        doctor_name:
          type: string
          readOnly: true
        date:
          type: string
          format: date
        start_time:
          type: string
          format: time
        end_time:
          type: string
          format: time
        status:
          allOf:
          - $ref: '#/components/schemas/AvailabilitySlotStatusEnum'
          readOnly: true
      required:
      - date
      - doctor_id
      - doctor_name
      - end_time
      - id
      - start_time
      - status
    AvailabilitySlotStatusEnum:
      enum:
      - AVAILABLE
      - LOCKED
      - BOOKED
      type: string
      description: |-
        * `AVAILABLE` - Available
        * `LOCKED` - Locked (In-Checkout)
        * `BOOKED` - Booked
    BatchCreateSlotResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        created_slots_count:
          type: integer
      required:
      - created_slots_count
      - message
      - success
    ConsultationBookResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        consultation:
          $ref: '#/components/schemas/ConsultationDetail'
      required:
      - consultation
      - message
      - success
    ConsultationCreateRequest:
      type: object
      properties:
        slot_id:
          type: string
          format: uuid
        chief_complaint:
          type: string
          minLength: 1
          maxLength: 255
        symptoms:
          type: string
          default: ''
      required:
      - chief_complaint
      - slot_id
    ConsultationDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        patient:
          allOf:
          - $ref: '#/components/schemas/UserDetail'
          readOnly: true
        doctor:
          allOf:
          - $ref: '#/components/schemas/DoctorList'
          readOnly: true
        slot:
          allOf:
          - $ref: '#/components/schemas/AvailabilitySlot'
          readOnly: true
        status:
          $ref: '#/components/schemas/ConsultationDetailStatusEnum'
        chief_complaint:
          type: string
          maxLength: 255
        symptoms:
          type: string
          readOnly: true
        video_room_id:
          type: string
          nullable: true
          maxLength: 128
        cancellation_reason:
          type: string
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        ended_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - chief_complaint
      - created_at
      - doctor
      - id
      - patient
      - slot
      - symptoms
      - updated_at
    ConsultationDetailStatusEnum:
      enum:
      - REQUESTED
      - CONFIRMED
      - IN_PROGRESS
      - COMPLETED
      - CANCELLED
      - NO_SHOW
      type: string
      description: |-
        * `REQUESTED` - Requested (Pending Payment)
        * `CONFIRMED` - Confirmed & Scheduled
        * `IN_PROGRESS` - In-Progress (Call Active)
        * `COMPLETED` - Completed
        * `CANCELLED` - Cancelled
        * `NO_SHOW` - No Show
    ConsultationStatusTransitionRequest:
      type: object
