name: Amrutam Telemedicine Backend CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/amrutam-backend

jobs:
  # ============================================================
  # Job 1: Lint, Test, Coverage, Security Scanning
  # ============================================================
  test-and-lint:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: amrutam_test_db
          POSTGRES_USER: amrutam_user
          POSTGRES_PASSWORD: amrutam_secure_password_2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install safety

      - name: Dependency Vulnerability Scan (pip-audit / safety)
        run: |
          safety check -r requirements.txt --output text || true
        continue-on-error: false

      - name: Code Quality & Linting (flake8 — fatal errors only)
        run: |
          flake8 apps tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Security SAST Scan (bandit)
        run: |
          bandit -r apps -ll -x tests

      - name: Database Migrations Check
        env:
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: amrutam_test_db
          DB_USER: amrutam_user
          DB_PASSWORD: amrutam_secure_password_2026
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key-32-chars-long-strictly-for-testing
          DATA_ENCRYPTION_KEY: dGVzdC1rZXktZm9yLWNpLW9ubHktbm90LWZvci1wcm9k
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py migrate

      - name: Validate OpenAPI 3.0 Schema
        env:
          SECRET_KEY: ci-test-secret-key-32-chars-long-strictly-for-testing
          DATA_ENCRYPTION_KEY: dGVzdC1rZXktZm9yLWNpLW9ubHktbm90LWZvci1wcm9k
        run: |
          python manage.py spectacular --file openapi.yaml --validate

      - name: Run Test Suite with Pytest & Coverage
        env:
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: amrutam_test_db
          DB_USER: amrutam_user
          DB_PASSWORD: amrutam_secure_password_2026
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key-32-chars-long-strictly-for-testing
          DATA_ENCRYPTION_KEY: dGVzdC1rZXktZm9yLWNpLW9ubHktbm90LWZvci1wcm9k
          RAZORPAY_WEBHOOK_SECRET: ci-test-razorpay-webhook-secret
          TESTING: "True"
          SECURE_SSL_REDIRECT: "False"
        run: |
          pytest --cov=apps --cov-report=xml --cov-report=term-missing --cov-fail-under=70

      - name: Upload Test Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          flags: unittests
          name: amrutam-coverage
        continue-on-error: true

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ============================================================
  # Job 2: Build & Scan Docker Image
  # ============================================================
  docker-build:
    runs-on: ubuntu-latest
    needs: test-and-lint
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=git-
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/image.tar

      - name: Scan Docker Image for Vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          input: /tmp/image.tar
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

      - name: Push Docker Image to Registry (main branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  # ============================================================
  # Job 3: Deploy to Staging (main branch only)
  # ============================================================
  deploy-staging:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure kubectl for Staging
        uses: azure/setup-kubectl@v4

      - name: Apply Kubernetes Manifests to Staging
        env:
          KUBECONFIG_B64: ${{ secrets.STAGING_KUBECONFIG_B64 }}
        run: |
          if [ -z "$KUBECONFIG_B64" ]; then
            echo "⚠️ STAGING_KUBECONFIG_B64 secret is not configured. Skipping staging deployment."
            exit 0
          fi
          echo "$KUBECONFIG_B64" | base64 -d > /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig
          # Update image tag in deployment
          IMAGE_TAG=git-$(echo "${{ github.sha }}" | head -c 7)
          kubectl set image deployment/amrutam-backend \
            backend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG} \
            --namespace=amrutam-staging
          kubectl rollout status deployment/amrutam-backend \
            --namespace=amrutam-staging \
            --timeout=120s
          echo "✅ Staging deployment complete: image=${IMAGE_TAG}"

      - name: Run Post-Deploy Smoke Tests
        env:
          STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
        run: |
          if [ -z "$STAGING_API_URL" ]; then
            echo "⚠️ STAGING_API_URL secret is not configured. Skipping staging smoke tests."
            exit 0
          fi
          echo "Running smoke tests against staging..."
          curl -f "${STAGING_API_URL}/api/v1/health/" \
            --max-time 10 \
            --retry 3 \
            --retry-delay 5 \
            -H "Accept: application/json" | python3 -m json.tool
          echo "✅ Smoke tests passed."

  # ============================================================
  # Job 4: Deploy to Production (manual approval required)
  # ============================================================
  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://api.amrutam.com

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure kubectl for Production
        uses: azure/setup-kubectl@v4

      - name: Blue-Green Deploy to Production
        env:
          KUBECONFIG_B64: ${{ secrets.PROD_KUBECONFIG_B64 }}
        run: |
          if [ -z "$KUBECONFIG_B64" ]; then
            echo "⚠️ PROD_KUBECONFIG_B64 secret is not configured. Skipping production deployment."
            exit 0
          fi
          echo "$KUBECONFIG_B64" | base64 -d > /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig
          IMAGE_TAG=git-$(echo "${{ github.sha }}" | head -c 7)
          kubectl set image deployment/amrutam-backend \
            backend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG} \
            --namespace=amrutam-production
          kubectl rollout status deployment/amrutam-backend \
            --namespace=amrutam-production \
            --timeout=300s
          echo "✅ Production deployment complete: image=${IMAGE_TAG}"

      - name: Post-Deploy Production Health Check
        env:
          PROD_API_URL: ${{ secrets.PROD_API_URL }}
        run: |
          if [ -z "$PROD_API_URL" ]; then
            echo "⚠️ PROD_API_URL secret is not configured. Skipping production health check."
            exit 0
          fi
          echo "Verifying production health..."
          curl -f "${PROD_API_URL}/api/v1/health/" \
            --max-time 10 \
            --retry 5 \
            --retry-delay 10 \
            -H "Accept: application/json"
          echo "✅ Production health check passed."
